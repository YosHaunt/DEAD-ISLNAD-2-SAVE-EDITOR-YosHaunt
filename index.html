<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal - Dead Island 2 Save Editor (DI2SE)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .portal-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        h1 {
            color: var(--accent);
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent);
            color: #000;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.2s;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
        }

        .btn:hover {
            background-color: var(--accent-hover);
            color: #fff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="portal-card">
        <h1>DI2SE EDITOR GUÍA YOSHAUNT</h1>
        <p>Accede a la guía interactiva completa de comandos y herramientas para Dead Island 2 Save Editor.</p>
        <a href="DI2SE Guía WEB.html" class="btn">Entrar a la Guía ➔</a>
    </div>

</body>
</html>
