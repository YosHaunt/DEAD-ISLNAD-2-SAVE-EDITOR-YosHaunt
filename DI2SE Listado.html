<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DI2SE Listado YosHaunt</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.9);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --border: #334155;
            --success: #10b981;
            --warning: #f43f5e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid var(--border); }
        h1 { color: var(--accent); font-size: 1.8rem; text-transform: uppercase; }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 15px; margin-bottom: 20px; }
        .search-bar { display: flex; gap: 15px; flex-wrap: wrap; }
        input, select { padding: 12px 15px; border-radius: 8px; border: 1px solid var(--border); background: #090d16; color: var(--text-main); font-size: 1rem; outline: none; }
        input:focus, select:focus { border-color: var(--accent); }
        .input-search { flex: 2; min-width: 250px; }
        .select-filter { flex: 1; min-width: 180px; }

        .file-upload-box { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; font-size: 0.9rem; color: var(--text-muted); }
        .file-upload-box input[type="file"] { color: var(--text-main); font-size: 0.85rem; }

        .table-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th { background: #090d16; color: var(--accent); padding: 14px; border-bottom: 2px solid var(--border); }
        td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:hover { background: rgba(51, 65, 85, 0.5); }

        .tag { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; background: #334155; color: #f8fafc; }
        .tag-weapon { background: #9333ea; }

        .btn-group { display: flex; gap: 6px; }
        .btn-sm { background: var(--accent); color: #000; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.75rem; }
        .btn-sm:hover { background: var(--accent-hover); color: white; }
        .btn-secondary { background: #334155; color: var(--text-main); }
        .btn-secondary:hover { background: #475569; }

        .item-img { width: 45px; height: 45px; object-fit: contain; background: #090d16; border-radius: 6px; border: 1px solid var(--border); padding: 2px; cursor: pointer; transition: transform 0.2s; }
        .item-img:hover { transform: scale(1.1); border-color: var(--accent); }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-content { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 8px; border: 2px solid var(--accent); background: #090d16; padding: 10px; }
        .modal-close { position: absolute; top: 20px; right: 30px; color: #f8fafc; font-size: 40px; font-weight: bold; cursor: pointer; }
        .modal-close:hover { color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📋 DI2SE Listado YosHaunt</h1>
    </header>

    <div class="card" style="border-color: var(--accent);">
        <div class="file-upload-box">
            <label>📂 <strong>Sube tus archivos CSV:</strong></label>
            <input type="file" id="csvFileInput" accept=".csv" multiple onchange="cargarCSVsLocales(event)">
            <span id="statusLoad" style="color: var(--warning); font-weight: bold;">⚠️ Carga los archivos CSV para usar</span>
        </div>
    </div>

    <div class="search-bar" style="margin-bottom: 20px;">
        <input type="text" id="searchInput" class="input-search" placeholder="🔍 Buscar por nombre, ui_name o id..." oninput="filtrarTabla()" disabled>
        <select id="typeFilter" class="select-filter" onchange="filtrarTabla()" disabled>
            <option value="ALL">Todas las Categorías</option>
        </select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 70px;">Img</th>
                    <th>Nombre Técnico (Name / ID)</th>
                    <th>Nombre Visible (UI)</th>
                    <th>Categoría / Tipo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">Carga los archivos CSV arriba para ver el listado.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="imageModal" class="modal" onclick="cerrarModal()">
    <span class="modal-close">&times;</span>
    <img class="modal-content" id="imgAmpliada">
</div>

<script>
let globalData = [];

function parseCSV(text) {
    const lines = text.split(/\r\n|\n/);
    if (lines.length < 2) return [];
    const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
    let result = [];
    for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const currentLine = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
        let obj = {};
        headers.forEach((h, index) => {
            let val = currentLine[index] ? currentLine[index].trim().replace(/^"|"$/g, '') : '';
            obj[h] = val;
        });
        result.push(obj);
    }
    return result;
}

function cargarCSVsLocales(event) {
    const files = event.target.files;
    let pendingFiles = files.length;
    globalData = [];

    for (let file of files) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const content = e.target.result;
            const parsed = parseCSV(content);
            
            parsed.forEach(row => {
                let name = row.name || row.ID || row.id || '';
                let ui_name = row.ui_name || row.UIName || row.DisplayName || name;
                let category = row.category || row.upgrade_type || row.Type || row.group || 'General';
                if (name) {
                    globalData.push({ name, ui_name, category });
                }
            });

            pendingFiles--;
            if (pendingFiles === 0) {
                const statusEl = document.getElementById('statusLoad');
                statusEl.style.color = 'var(--success)';
                statusEl.innerHTML = `✅ Cargados (${globalData.length} registros totales)`;
                
                document.getElementById('searchInput').disabled = false;
                document.getElementById('typeFilter').disabled = false;
                
                poblarFiltroCategorias();
                filtrarTabla();
            }
        };
        reader.readAsText(file);
    }
}

function poblarFiltroCategorias() {
    const filterSelect = document.getElementById('typeFilter');
    filterSelect.innerHTML = '<option value="ALL">Todas las Categorías</option>';
    
    const categorias = [...new Set(globalData.map(d => d.category))].filter(Boolean).sort();
    categorias.forEach(cat => {
        filterSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
    });
}

function filtrarTabla() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const catFilter = document.getElementById('typeFilter').value;
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    let rows = globalData.filter(d => {
        const matchQuery = !query || (d.name && d.name.toLowerCase().includes(query)) || (d.ui_name && d.ui_name.toLowerCase().includes(query));
        const matchCat = catFilter === 'ALL' || d.category === catFilter;
        return matchQuery && matchCat;
    });

    if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 20px;">No se encontraron resultados.</td></tr>`;
        return;
    }

    rows.forEach(r => {
        const tr = document.createElement('tr');
        const imagePath = `ITEMS IMG/${r.name}.png`;

        tr.innerHTML = `
            <td>
                <img src="${imagePath}" class="item-img" alt="" onclick="abrirModal(this.src)" onerror="this.src='DI2 NO IMG.png';">
            </td>
            <td><code>${r.name}</code></td>
            <td><strong>${r.ui_name}</strong></td>
            <td><span class="tag tag-weapon">${r.category}</span></td>
            <td>
                <div class="btn-group">
                    <button class="btn-sm" type="button" onclick="copiarTexto(this, \`${r.name.replace(/\\/g, '\\\\').replace(/`/g, '\\`')}\`)">Copiar ID</button>
                    <button class="btn-sm btn-secondary" type="button" onclick="copiarTexto(this, \`${r.ui_name.replace(/\\/g, '\\\\').replace(/`/g, '\\`')}\`)">Copiar UI</button>
                </div>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

function abrirModal(src) {
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('imgAmpliada');
    modal.style.display = 'flex';
    modalImg.src = src;
}

function cerrarModal() {
    document.getElementById('imageModal').style.display = 'none';
}

function copiarTexto(btn, txt) {
    navigator.clipboard.writeText(txt).then(() => {
        const orig = btn.innerText;
        btn.innerText = '¡Copiado!';
        setTimeout(() => btn.innerText = orig, 1200);
    });
}
</script>
</body>
</html>
